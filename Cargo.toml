[workspace]
resolver = "2"
members = [
    "crates/marqdo-span",
    "crates/marqdo-value",
    "crates/marqdo-expression",
    "crates/marqdo-markdown",
    "crates/marqdo-ir",
    "crates/marqdo-frontend",
    "crates/marqdo-foreign",
    "crates/marqdo-plugin-abi",
    "crates/marqdo-provider-worker",
    "crates/marqdo-plugin-sdk",
    "crates/marqdo-host",
    "crates/marqdo-runtime",
    "crates/marqdo-package",
    "crates/marqdo-sandbox",
    "crates/cli",
]

[workspace.package]
version = "3.0.0-beta.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cflmy/marqdo-cli"
authors = ["Marqdo contributors"]

[workspace.dependencies]
marqdo-span = { path = "crates/marqdo-span" }
marqdo-value = { path = "crates/marqdo-value" }
marqdo-expression = { path = "crates/marqdo-expression" }
marqdo-markdown = { path = "crates/marqdo-markdown" }
marqdo-ir = { path = "crates/marqdo-ir" }
marqdo-frontend = { path = "crates/marqdo-frontend" }
marqdo-foreign = { path = "crates/marqdo-foreign" }
marqdo-plugin-abi = { path = "crates/marqdo-plugin-abi" }
marqdo-host = { path = "crates/marqdo-host" }
marqdo-runtime = { path = "crates/marqdo-runtime" }
marqdo-package = { path = "crates/marqdo-package" }
marqdo-sandbox = { path = "crates/marqdo-sandbox" }
comrak = { version = "=1.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
semver = "1"
hex = "0.4"
libloading = "0.8"
tempfile = "3"
flate2 = "1"
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rcgen = "0.13"
regex = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
glob = "0.3"
libc = "0.2"
unicode-normalization = "0.1"
unicode-ident = "1"
