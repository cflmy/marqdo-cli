# Woodpecker CI pipeline for the Rust workspace.
# The strict security lane needs a disposable VM/self-hosted runner and is
# intentionally not part of this docker pipeline; see docs/security-vm.md.
when:
  event: [push, pull_request]

steps:
  test:
    image: rust:1.100-bookworm
    commands:
      - rustup component add clippy rustfmt
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates python3 build-essential gcc-mingw-w64-x86-64
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y --no-install-recommends nodejs
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings
      # The provider CLI tests resolve a real provider worker next to the CLI
      # binary. Build it once so the test harness does not need a nested build.
      - cargo build --locked -p marqdo-provider-worker
      - cargo test --workspace --locked
      - cargo test -p marqdo-cli --test docs_consistency
      - cargo test -p marqdo-cli --test architecture_boundaries
      - python3 -m unittest discover -s tools/ci -p "test_*.py"
      - cargo test -p marqdo-cli --test stdlib_product
      # Windows compile gate: runtime lanes are native on GitHub; this catches
      # cfg/compile regressions on the Linux CI without a Windows runner.
      - rustup target add x86_64-pc-windows-gnu
      - cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  build:
    image: rust:1.100-bookworm
    depends_on: [test]
    commands:
      # Release archives must ship both binaries: the provider worker is the
      # only supported transport and resolution is a sibling-of-CLI lookup.
      - cargo build --release --locked -p marqdo-cli -p marqdo-provider-worker
      - test -x target/release/marqdo-provider-worker
      # Build the deterministic archive from this exact commit and cold-install
      # smoke-test it; the package script refuses a dirty tree or wrong SHA.
      - |
        set -eu
        version="$(cargo metadata --no-deps --format-version 1 --offline \
          | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="marqdo-cli"))')"
        python3 tools/release/package.py --source-sha "$CI_COMMIT_SHA" --version "$version"
        python3 tools/release/smoke.py --archive dist/marqdo-*.tar.gz
