# G4 fixed performance node.
#
# Manual only: this workflow never runs on push or pull_request and therefore
# never executes untrusted PR code on the designated performance agent. The
# repository currently has one Woodpecker agent (agent_id 1), so it is the
# fixed node; the CPU affinity and hardware/toolchain manifest are recorded in
# every report. Do not compare its timings with another machine or with
# QEMU/TCG.
when:
  event: [manual]
  branch: [master]

steps:
  measure:
    image: rust:1.100-bookworm
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends python3 util-linux ca-certificates
      - cargo build --release --locked -p marqdo-cli
      - |
        set -euo pipefail
        allowed="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
        cpu_list="${MARQDO_PERF_CPU_LIST:-$(printf '%s' "$allowed" | cut -d, -f1 | cut -d- -f1)}"
        echo "G4_NODE host=$(uname -n) kernel=$(uname -r) arch=$(uname -m) allowed_cpus=$allowed pin=$cpu_list"
        echo "G4_CPU $(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo | xargs)"
        echo "G4_GOVERNOR $(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo unavailable)"
        python3 tools/perf/runner.py --no-build --warmups 5 --samples 20 \
          --approved-node --platform-id woodpecker-agent-1 \
          --cpu-list "$cpu_list" --out perf.json
        python3 - <<'PY'
        import json

        with open("perf.json", encoding="utf-8") as handle:
            report = json.load(handle)
        print(
            "G4_STATUS "
            f"{report['status']} correctness={report['correctness']} "
            f"platform={report['platform_id']} "
            f"binary={report['binary']['sha256']}"
        )
        for workload in report["workloads"]:
            print(
                "G4_WORKLOAD "
                f"{workload['name']} {workload['status']} "
                f"p50={workload.get('median_ms')} "
                f"p95={workload.get('p95_ms')} "
                f"rss={workload.get('max_rss_kb_median')}"
            )
        PY
        echo "G4_REPORT_BEGIN"
        cat perf.json
        echo "G4_REPORT_END"
