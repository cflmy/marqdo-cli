[package]
name = "marqdo-sdk-plugin-fixture"
version = "0.1.0"
edition = "2021"
publish = false

# Independent workspace: this fixture must build with only the public SDK
# artifacts, exactly as a third-party plugin would.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
marqdo-plugin-sdk = { path = "../../crates/marqdo-plugin-sdk" }
